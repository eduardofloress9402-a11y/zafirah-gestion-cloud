{% extends "base.html" %}{% block content %}
<div class="page-head"><div><p class="eyebrow">Producción</p><h1>{{ 'Editar receta' if recipe else 'Nueva receta' }}</h1></div><a class="btn ghost" href="/recipes">Volver</a></div>
<form method="post" action="/recipes/save" class="card form-card"><input type="hidden" name="csrf_token" value="{{ csrf }}">{% if recipe %}<input type="hidden" name="id" value="{{ recipe.id }}">{% endif %}
<div class="form-grid"><label>Producto<select name="product_id" required>{% for p in products %}<option value="{{ p.id }}" {{ 'selected' if recipe and recipe.product_id==p.id }}>{{ p.name }}</option>{% endfor %}</select></label><label>Rendimiento de la receta<input type="number" step="0.001" min="0.001" name="yield_qty" value="{{ recipe.yield_qty if recipe else 1 }}" required></label></div>
<h3>Insumos utilizados</h3><div class="table-wrap"><table id="recipeTable"><thead><tr><th>Insumo</th><th>Cantidad por receta</th><th></th></tr></thead><tbody>
{% if recipe %}{% for ri in recipe.items %}<tr><td><select name="material_id" required>{% for m in materials %}<option value="{{ m.id }}" {{ 'selected' if m.id==ri.material_id }}>{{ m.name }} ({{ m.unit }})</option>{% endfor %}</select></td><td><input type="number" step="0.0001" min="0" name="qty" value="{{ ri.qty }}" required></td><td><button type="button" class="icon-btn" onclick="delRow(this)">×</button></td></tr>{% endfor %}{% else %}<tr><td><select name="material_id" required>{% for m in materials %}<option value="{{ m.id }}">{{ m.name }} ({{ m.unit }})</option>{% endfor %}</select></td><td><input type="number" step="0.0001" min="0" name="qty" required></td><td><button type="button" class="icon-btn" onclick="delRow(this)">×</button></td></tr>{% endif %}
</tbody></table></div><button type="button" class="btn ghost" onclick="addRow('recipeTable','recipeRow')">+ Agregar insumo</button><label class="wide">Notas<textarea name="notes" rows="3">{{ recipe.notes if recipe and recipe.notes else '' }}</textarea></label><div class="form-actions"><button class="btn primary">Guardar receta</button></div></form>
<template id="recipeRow"><tr><td><select name="material_id" required>{% for m in materials %}<option value="{{ m.id }}">{{ m.name }} ({{ m.unit }})</option>{% endfor %}</select></td><td><input type="number" step="0.0001" min="0" name="qty" required></td><td><button type="button" class="icon-btn" onclick="delRow(this)">×</button></td></tr></template>{% endblock %}
