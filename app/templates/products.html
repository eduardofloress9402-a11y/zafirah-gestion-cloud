{% extends "base.html" %}{% block content %}
<div class="page-head"><div><p class="eyebrow">Catálogo</p><h1>Productos terminados</h1></div><a class="btn primary" href="/products/new">+ Producto</a></div>
<div class="table-wrap"><table><thead><tr><th>SKU</th><th>Producto</th><th>Categoría</th><th class="num">Costo</th><th class="num">Precio</th><th class="num">Stock</th><th>Acciones</th></tr></thead><tbody>
{% for x in items %}
<tr class="{{ 'inactive' if not x.active }}">
  <td>{{ x.sku }}</td>
  <td><b>{{ x.name }}</b></td>
  <td>{{ x.category }}</td>
  <td class="num">{{ x.cost|money }}</td>
  <td class="num">{{ x.sale_price|money }}</td>
  <td class="num"><span class="pill {{ 'danger' if x.stock <= x.min_stock else '' }}">{{ x.stock|num }}</span></td>
  <td>
    <div class="buttons">
      <a class="link" href="/products/{{ x.id }}/edit">Editar</a>
      <form method="post" action="/products/{{ x.id }}/delete" onsubmit="return confirm('¿Seguro que querés borrar este producto? Esta acción no se puede deshacer.');">
        <input type="hidden" name="csrf_token" value="{{ csrf }}">
        <button class="link danger-text" type="submit">Borrar</button>
      </form>
    </div>
  </td>
</tr>
{% endfor %}
</tbody></table></div>
{% endblock %}
