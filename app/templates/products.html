{% extends "base.html" %}{% block content %}
<div class="page-head"><div><p class="eyebrow">Catálogo</p><h1>Productos terminados</h1></div><a class="btn primary" href="/products/new">+ Producto</a></div>
<div class="table-wrap"><table><thead><tr><th>SKU</th><th>Producto</th><th>Categoría</th><th class="num">Costo</th><th class="num">Precio</th><th class="num">Stock</th><th></th></tr></thead><tbody>
{% for x in items %}<tr class="{{ 'inactive' if not x.active }}"><td>{{ x.sku }}</td><td><b>{{ x.name }}</b></td><td>{{ x.category }}</td><td class="num">{{ x.cost|money }}</td><td class="num">{{ x.sale_price|money }}</td><td class="num"><span class="pill {{ 'danger' if x.stock <= x.min_stock else '' }}">{{ x.stock|num }}</span></td><td><a class="link" href="/products/{{ x.id }}/edit">Editar</a></td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
