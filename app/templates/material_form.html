{% extends "base.html" %}{% block content %}
<div class="page-head"><div><p class="eyebrow">Insumos</p><h1>{{ 'Editar insumo' if item else 'Nuevo insumo' }}</h1></div><a class="btn ghost" href="/materials">Volver</a></div>
<form method="post" action="/materials/save" class="card form-card"><input type="hidden" name="csrf_token" value="{{ csrf }}">{% if item %}<input type="hidden" name="id" value="{{ item.id }}">{% endif %}
<div class="form-grid"><label>SKU<input name="sku" required value="{{ item.sku if item else '' }}"></label><label>Nombre<input name="name" required value="{{ item.name if item else '' }}"></label><label>Unidad<input name="unit" placeholder="kg, g, ml, unidad..." value="{{ item.unit if item else 'unidad' }}"></label><label>Costo medio<input type="number" step="0.0001" min="0" name="avg_cost" value="{{ item.avg_cost if item else 0 }}"></label><label>Stock actual<input type="number" step="0.001" min="0" name="stock" value="{{ item.stock if item else 0 }}"></label><label>Stock mínimo<input type="number" step="0.001" min="0" name="min_stock" value="{{ item.min_stock if item else 0 }}"></label><label class="check"><input type="checkbox" name="active" value="1" {{ 'checked' if (not item or item.active) }}> Activo</label></div><div class="form-actions"><button class="btn primary">Guardar</button></div></form>{% endblock %}
