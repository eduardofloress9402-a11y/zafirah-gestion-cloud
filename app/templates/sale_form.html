{% extends "base.html" %}{% block content %}
<div class="page-head"><div><p class="eyebrow">Ventas</p><h1>Nueva venta</h1></div><a class="btn ghost" href="/sales">Volver</a></div>
<form method="post" action="/sales/save" class="card form-card"><input type="hidden" name="csrf_token" value="{{ csrf }}"><div class="form-grid"><label>Fecha<input type="date" name="date" value="{{ today.isoformat() }}" required></label><label>Cliente<select name="customer_id"><option value="">Consumidor final</option>{% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></label><label>Medio de pago<select name="payment_method"><option>Efectivo</option><option>Transferencia</option><option>Mercado Pago</option><option>Tarjeta</option><option>Otro</option></select></label><label>Canal<select name="channel"><option>Directa</option><option>Web</option><option>Instagram</option><option>WhatsApp</option><option>Mercado Libre</option><option>Feria</option><option>Otro</option></select></label></div><h3>Productos</h3>
<div class="table-wrap"><table id="saleTable"><thead><tr><th>Producto</th><th>Stock</th><th>Cantidad</th><th>Precio unitario</th><th></th></tr></thead><tbody><tr><td><select name="product_id" onchange="syncPrice(this)" required>{% for p in products %}<option value="{{ p.id }}" data-price="{{ p.sale_price }}" data-stock="{{ p.stock|num }}">{{ p.name }}</option>{% endfor %}</select></td><td class="stock-preview">—</td><td><input type="number" step="0.001" min="0" name="qty" required></td><td><input type="number" step="0.01" min="0" name="unit_price" data-auto="1" required></td><td><button type="button" class="icon-btn" onclick="delRow(this)">×</button></td></tr></tbody></table></div><button type="button" class="btn ghost" onclick="addRow('saleTable','saleRow')">+ Agregar producto</button><label class="wide">Notas<textarea name="notes" rows="3"></textarea></label><div class="form-actions"><button class="btn primary">Registrar venta</button></div></form>
<template id="saleRow"><tr><td><select name="product_id" onchange="syncPrice(this)" required>{% for p in products %}<option value="{{ p.id }}" data-price="{{ p.sale_price }}" data-stock="{{ p.stock|num }}">{{ p.name }}</option>{% endfor %}</select></td><td class="stock-preview">—</td><td><input type="number" step="0.001" min="0" name="qty" required></td><td><input type="number" step="0.01" min="0" name="unit_price" data-auto="1" required></td><td><button type="button" class="icon-btn" onclick="delRow(this)">×</button></td></tr></template>
{% endblock %}{% block scripts %}<script>document.querySelectorAll('#saleTable select[name="product_id"]').forEach(syncPrice);</script>{% endblock %}
