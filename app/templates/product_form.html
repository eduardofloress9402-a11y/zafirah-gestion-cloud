{% extends "base.html" %}{% block content %}
<div class="page-head"><div><p class="eyebrow">Productos</p><h1>{{ 'Editar producto' if item else 'Nuevo producto' }}</h1></div><a class="btn ghost" href="/products">Volver</a></div>
<form method="post" action="/products/save" class="card form-card"><input type="hidden" name="csrf_token" value="{{ csrf }}">{% if item %}<input type="hidden" name="id" value="{{ item.id }}">{% endif %}
<div class="form-grid"><label>SKU<input name="sku" required value="{{ item.sku if item else '' }}"></label><label>Nombre<input name="name" required value="{{ item.name if item else '' }}"></label><label>Categoría<input name="category" value="{{ item.category if item else 'Jabones' }}"></label><label>Precio de venta<input type="number" step="0.01" min="0" name="sale_price" value="{{ item.sale_price if item else 0 }}"></label><label>Costo unitario actual<input type="number" step="0.0001" min="0" name="cost" value="{{ item.cost if item else 0 }}"></label><label>Stock actual<input type="number" step="0.001" min="0" name="stock" value="{{ item.stock if item else 0 }}"></label><label>Stock mínimo<input type="number" step="0.001" min="0" name="min_stock" value="{{ item.min_stock if item else 0 }}"></label><label class="check"><input type="checkbox" name="active" value="1" {{ 'checked' if (not item or item.active) }}> Activo</label></div>
<p class="help">Si modificás el stock actual, el sistema generará un movimiento de ajuste manual.</p><div class="form-actions"><button class="btn primary">Guardar</button></div></form>
{% endblock %}
