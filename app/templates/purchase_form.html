{% extends "base.html" %}{% block content %}
<div class="page-head"><div><p class="eyebrow">Compras</p><h1>Nueva compra de insumos</h1></div><a class="btn ghost" href="/purchases">Volver</a></div>
<form method="post" action="/purchases/save" class="card form-card"><input type="hidden" name="csrf_token" value="{{ csrf }}"><div class="form-grid"><label>Fecha<input type="date" name="date" value="{{ today.isoformat() }}" required></label><label>Proveedor<select name="supplier_id"><option value="">Sin especificar</option>{% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></label></div><h3>Detalle</h3>
<div class="table-wrap"><table id="purchaseTable"><thead><tr><th>Insumo</th><th>Cantidad</th><th>Costo unitario</th><th></th></tr></thead><tbody><tr><td><select name="material_id" required>{% for m in materials %}<option value="{{ m.id }}">{{ m.name }} ({{ m.unit }})</option>{% endfor %}</select></td><td><input type="number" step="0.001" min="0" name="qty" required></td><td><input type="number" step="0.0001" min="0" name="unit_cost" required></td><td><button type="button" class="icon-btn" onclick="delRow(this)">×</button></td></tr></tbody></table></div><button type="button" class="btn ghost" onclick="addRow('purchaseTable','purchaseRow')">+ Agregar línea</button><label class="wide">Notas<textarea name="notes" rows="3"></textarea></label><div class="form-actions"><button class="btn primary">Registrar compra</button></div></form>
<template id="purchaseRow"><tr><td><select name="material_id" required>{% for m in materials %}<option value="{{ m.id }}">{{ m.name }} ({{ m.unit }})</option>{% endfor %}</select></td><td><input type="number" step="0.001" min="0" name="qty" required></td><td><input type="number" step="0.0001" min="0" name="unit_cost" required></td><td><button type="button" class="icon-btn" onclick="delRow(this)">×</button></td></tr></template>{% endblock %}
