{% extends "base.html" %}{% block content %}
<div class="page-head"><div><p class="eyebrow">Inventario</p><h1>Insumos y materias primas</h1></div><a class="btn primary" href="/materials/new">+ Insumo</a></div>
<div class="table-wrap"><table><thead><tr><th>SKU</th><th>Insumo</th><th>Unidad</th><th class="num">Costo medio</th><th class="num">Stock</th><th class="num">Mínimo</th><th></th></tr></thead><tbody>
{% for x in items %}<tr class="{{ 'inactive' if not x.active }}"><td>{{ x.sku }}</td><td><b>{{ x.name }}</b></td><td>{{ x.unit }}</td><td class="num">{{ x.avg_cost|money }}</td><td class="num"><span class="pill {{ 'danger' if x.stock <= x.min_stock else '' }}">{{ x.stock|num }}</span></td><td class="num">{{ x.min_stock|num }}</td><td><a class="link" href="/materials/{{ x.id }}/edit">Editar</a></td></tr>{% endfor %}
</tbody></table></div>{% endblock %}
